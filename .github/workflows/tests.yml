name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore pre-post-ai-api.slnx
      - run: dotnet build pre-post-ai-api.slnx --no-restore
      - run: dotnet test --no-build --verbosity normal test/Domain.Tests
      - run: dotnet test --no-build --verbosity normal test/External.Tests
      - run: dotnet test --no-build --verbosity normal test/Api.Tests

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: >-
          curl --fail-with-body --silent --show-error
          --request POST "$COOLIFY_WEBHOOK"
          --header "Authorization: Bearer $COOLIFY_TOKEN"
